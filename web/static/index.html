<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yatori 刷课控制台</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2028;
      --panel2: #222b36;
      --border: #2a3441;
      --text: #e6edf3;
      --dim: #8b98a5;
      --accent: #4f8cff;
      --accent2: #2f6fe0;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: all .15s
    }

    input,
    select {
      font: inherit;
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent)
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      background: rgba(15, 20, 25, .92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .5px
    }

    .logo b {
      color: var(--accent)
    }

    .spacer {
      flex: 1
    }

    .btn {
      padding: 8px 14px;
      background: var(--panel2);
      color: var(--text)
    }

    .btn:hover {
      background: #2d3948
    }

    .btn.primary {
      background: var(--accent);
      color: #fff
    }

    .btn.primary:hover {
      background: var(--accent2)
    }

    .btn.danger {
      background: transparent;
      color: var(--red);
      border: 1px solid #5a2a2a
    }

    .btn.danger:hover {
      background: #3a1f1f
    }

    .btn.sm {
      padding: 5px 10px;
      font-size: 13px
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 20px 60px
    }

    .stats {
      color: var(--dim);
      margin-bottom: 14px;
      font-size: 13px
    }

    .stats b {
      color: var(--text)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform .15s, border-color .15s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #3a4a5c
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .badge {
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 99px;
      font-weight: 600;
      background: rgba(79, 140, 255, .15);
      color: var(--accent);
    }

    .badge.g {
      background: rgba(63, 185, 80, .15);
      color: var(--green)
    }

    .badge.o {
      background: rgba(255, 143, 79, .15);
      color: #ff8f4f
    }

    .badge.p {
      background: rgba(158, 106, 255, .15);
      color: #9e6aff
    }

    .badge.d {
      background: rgba(139, 152, 165, .15);
      color: var(--dim)
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--dim)
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3a4553
    }

    .dot.on {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.6s infinite
    }

    @keyframes pulse {
      50% {
        opacity: .45
      }
    }

    .acct {
      font-size: 18px;
      font-weight: 700;
      word-break: break-all
    }

    .meta {
      font-size: 12.5px;
      color: var(--dim);
      word-break: break-all;
      white-space: pre-line
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto
    }

    .empty {
      color: var(--dim);
      text-align: center;
      padding: 60px 0
    }

    .mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .mask.show {
      display: flex
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 430px;
      padding: 20px;
      max-height: 86vh;
      overflow: auto
    }

    .modal h3 {
      font-size: 16px;
      margin-bottom: 14px
    }

    .field {
      margin-bottom: 12px
    }

    .field label {
      display: block;
      font-size: 12.5px;
      color: var(--dim);
      margin-bottom: 5px
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 16px
    }

    #logPanel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 40vh;
      z-index: 40;
      background: #0b0f14;
      border-top: 1px solid var(--border);
      display: none;
      flex-direction: column;
    }

    #logPanel.show {
      display: flex
    }

    #logBar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 13px
    }

    #logBody {
      flex: 1;
      overflow: auto;
      padding: 10px 14px;
      font: 12px/1.55 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      word-break: break-all;
      color: #9fb0c0
    }

    #logBody .le {
      color: var(--red)
    }

    #logBody .lw {
      color: var(--yellow)
    }

    #toastWrap {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 99;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .toast {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      border-radius: 10px;
      max-width: 340px;
      animation: slidein .2s;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
      font-size: 13px
    }

    .toast.ok {
      border-left-color: var(--green)
    }

    .toast.err {
      border-left-color: var(--red)
    }

    @keyframes slidein {
      from {
        transform: translateX(30px);
        opacity: 0
      }
    }

    .course-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px
    }

    .course-item:last-child {
      border-bottom: none
    }

    body.log-open main {
      padding-bottom: calc(40vh + 40px)
    }

    @media (max-width:720px) {

      header,
      .logo {
        width: 100%
      }

      .grid {
        grid-template-columns: 1fr
      }

      main {
        padding: 14px 12px 60px
      }

      #logPanel {
        height: 46vh
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Yatori <b>刷课控制台</b></div>
    <div class="spacer"></div>
    <button class="btn primary" onclick="openAdd()">添加账号</button>
    <button class="btn" onclick="importConfig(this)">导入 config.yaml</button>
    <button class="btn" onclick="loadList()">刷新</button>
    <button class="btn" onclick="toggleLog()" id="logBtn">实时日志</button>
  </header>
  <main>
    <div class="stats" id="stats">加载中...</div>
    <div class="grid" id="grid"></div>
  </main>

  <div class="mask" id="editMask">
    <div class="modal">
      <h3 id="modalTitle">添加账号</h3>
      <div class="field"><label>平台</label><select id="fType"></select></div>
      <div class="field"><label>账号 / 手机号</label><input id="fAccount" placeholder="请输入平台账号"></div>
      <div class="field"><label>密码 / Token / Cookie</label><input id="fPassword" type="password" placeholder="请输入密码">
      </div>
      <div class="field" id="urlField" style="display:none"><label>学校站点 URL（英华/海旗等平台需要）</label><input id="fUrl"
          placeholder="https://..."></div>
      <div class="field"><label>备注（可选）</label><input id="fRemark" placeholder="如：张三 2024级"></div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('editMask')">取消</button>
        <button class="btn primary" id="saveBtn" onclick="saveAccount()">保存</button>
      </div>
    </div>
  </div>

  <div class="mask" id="courseMask">
    <div class="modal">
      <h3>课程列表</h3>
      <div id="courseList" class="meta">加载中...</div>
      <div class="modal-actions"><button class="btn" onclick="closeModal('courseMask')">关闭</button></div>
    </div>
  </div>

  <div id="logPanel">
    <div id="logBar">
      <span>实时日志</span><span class="dot" id="logDot"></span>
      <div class="spacer"></div>
      <button class="btn sm" onclick="clearLog()">清空</button>
      <button class="btn sm" onclick="toggleLog()">收起</button>
    </div>
    <div id="logBody"></div>
  </div>

  <div id="toastWrap"></div>

  <script>
    const API = '/api/v1';
    const PLATFORMS = [
      ['XUEXITONG', '学习通', ''], ['YINGHUA', '英华学堂', 'p'],
      ['WEBAN', '安全微伴', 'g'], ['ZHIHUISHU', '智慧树', 'o'],
      ['ENAEA', '学习公社', ''], ['CQIE', '重庆工程学院', ''],
      ['KETANGX', '码上研训', ''], ['WELEARN', 'WeLearn', ''],
      ['ICVE', '智慧职教', ''], ['QSXT', '青书学堂', ''],
      ['HQKJ', '海旗科技', ''],
    ];
    const URL_PLATFORMS = ['YINGHUA', 'HQKJ', 'CQIE', 'WELEARN'];
    const $ = s => document.querySelector(s);
    let users = [];
    let editingUid = '';

    function toast(msg, type) {
      const d = document.createElement('div');
      d.className = 'toast ' + (type || '');
      d.textContent = msg;
      $('#toastWrap').appendChild(d);
      setTimeout(() => d.remove(), 4200);
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function pName(v) { const p = PLATFORMS.find(x => x[0] === v); return p ? p[1] : v; }
    function pCls(v) { const p = PLATFORMS.find(x => x[0] === v); return p ? p[2] : 'd'; }

    async function api(path, opts) {
      const r = await fetch(API + path, opts);
      return r.json();
    }
    function todayStr() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    async function loadList() {
      try {
        const res = await api('/accountList');
        const data = res.data || {};
        users = data.users || [];
        render();
      } catch (e) {
        $('#stats').textContent = '无法连接服务: ' + e.message;
      }
    }

    function render() {
      const running = users.filter(u => u.isRunning).length;
      $('#stats').innerHTML = '共 <b>' + users.length + '</b> 个账号 · <b>' + running + '</b> 个运行中';
      const g = $('#grid');
      if (!users.length) {
        g.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有账号——点右上角「添加账号」或「导入 config.yaml」开始使用</div>';
        return;
      }
      g.innerHTML = users.map(u => {
        const cfg = (() => { try { return JSON.parse(u.userConfigJson || '{}'); } catch (e) { return {}; } })();
        const running = u.isRunning;
        return '<div class="card">' +
          '<div class="card-top"><span class="badge ' + pCls(u.accountType) + '">' + esc(pName(u.accountType)) + '</span>' +
          '<span class="status"><span class="dot' + (running ? ' on' : '') + '"></span>' + (running ? '运行中' : '空闲') + '</span></div>' +
          '<div class="acct">' + esc(u.account) + '</div>' +
          '<div class="meta">' + (cfg.remarkName ? esc(cfg.remarkName) + '\n' : '') + (u.url ? esc(u.url) : '') + '</div>' +
          '<div class="actions">' +
          (running
            ? '<button class="btn sm" onclick="stopBrush(\'' + u.uid + '\',this)">停止</button>'
            : '<button class="btn sm primary" onclick="startBrush(\'' + u.uid + '\',this)">启动刷课</button>') +
          '<button class="btn sm" onclick="viewCourses(\'' + u.uid + '\')">课程</button>' +
          '<button class="btn sm" onclick="openEdit(\'' + u.uid + '\')">编辑</button>' +
          '<button class="btn sm danger" onclick="delAccount(\'' + u.uid + '\')">删除</button>' +
          '</div></div>';
      }).join('');
    }

    function openAdd() {
      editingUid = '';
      $('#modalTitle').textContent = '添加账号';
      $('#fType').value = 'XUEXITONG';
      $('#fAccount').value = ''; $('#fPassword').value = '';
      $('#fUrl').value = ''; $('#fRemark').value = '';
      syncUrlField();
      $('#editMask').classList.add('show');
    }
    function openEdit(uid) {
      const u = users.find(x => x.uid === uid);
      if (!u) return;
      editingUid = uid;
      const cfg = (() => { try { return JSON.parse(u.userConfigJson || '{}'); } catch (e) { return {}; } })();
      $('#modalTitle').textContent = '编辑账号';
      $('#fType').value = u.accountType;
      $('#fType').disabled = true;
      $('#fAccount').value = u.account;
      $('#fPassword').value = u.password;
      $('#fUrl').value = u.url || '';
      $('#fRemark').value = cfg.remarkName || '';
      syncUrlField();
      $('#editMask').classList.add('show');
    }
    function syncUrlField() {
      $('#urlField').style.display = URL_PLATFORMS.includes($('#fType').value) ? '' : 'none';
    }
    function closeModal(id) { $('#' + id).classList.remove('show'); if (id === 'editMask') $('#fType').disabled = false; }

    async function saveAccount() {
      const body = {
        accountType: $('#fType').value,
        account: $('#fAccount').value.trim(),
        password: $('#fPassword').value,
        url: $('#fUrl').value.trim(),
        remarkName: $('#fRemark').value.trim(),
      };
      if (!body.account || !body.password) { toast('账号和密码不能为空', 'err'); return; }
      $('#saveBtn').disabled = true;
      try {
        const res = editingUid
          ? await api('/updateAccount', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ uid: editingUid }, body)) })
          : await api('/addAccount', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (res.code === 200) { toast(editingUid ? '已保存' : '添加成功', 'ok'); closeModal('editMask'); loadList(); }
        else toast(res.message || '操作失败', 'err');
      } catch (e) { toast('请求失败: ' + e.message, 'err'); }
      $('#saveBtn').disabled = false;
    }

    async function delAccount(uid) {
      if (!confirm('确定删除该账号？')) return;
      const res = await api('/deleteAccount', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid }) });
      toast(res.message || '', res.code === 200 ? 'ok' : 'err');
      loadList();
    }

    async function startBrush(uid, btn) {
      btn.disabled = true;
      const res = await api('/startBrush/' + uid);
      toast(res.message || '', res.code === 200 ? 'ok' : 'err');
      setTimeout(loadList, 800);
    }
    async function stopBrush(uid, btn) {
      btn.disabled = true;
      const res = await api('/stopBrush/' + uid);
      toast(res.message || '', res.code === 200 ? 'ok' : 'err');
      setTimeout(loadList, 500);
    }

    async function viewCourses(uid) {
      $('#courseList').textContent = '正在登录并拉取课程（可能需要十几秒）...';
      $('#courseMask').classList.add('show');
      try {
        const res = await api('/getAccountCourseList/' + uid);
        const list = (res.data || {}).courseList || [];
        $('#courseList').innerHTML = list.length
          ? list.map(c => '<div class="course-item">' + esc(c.courseName) +
            (c.teacher ? ' <span style="color:var(--dim)">· ' + esc(c.teacher) + '</span>' : '') + '</div>').join('')
          : '未获取到课程（可能未登录成功或无课程）';
      } catch (e) { $('#courseList').textContent = '获取失败: ' + e.message; }
    }

    async function importConfig(btn) {
      btn.disabled = true;
      try {
        const res = await api('/importConfig', { method: 'POST' });
        toast(res.message || '', res.code === 200 ? 'ok' : 'err');
        loadList();
      } catch (e) { toast('导入失败: ' + e.message, 'err'); }
      btn.disabled = false;
    }

    let es = null;
    function toggleLog() {
      const panel = $('#logPanel');
      if (panel.classList.contains('show')) { panel.classList.remove('show'); document.body.classList.remove('log-open'); stopLog(); return; }
      panel.classList.add('show');
      document.body.classList.add('log-open');
      startLog();
      loadList();
    }
    function startLog() {
      stopLog();
      try {
        es = new EventSource(API + '/streamLog/' + todayStr());
        es.onopen = () => { $('#logDot').classList.add('on'); appendLog('—— 已连接实时日志 ——'); };
        es.onmessage = ev => appendLog(ev.data);
        es.onerror = () => { $('#logDot').classList.remove('on'); appendLog('—— 日志连接中断，稍后自动重试 ——'); };
      } catch (e) { toast('日志连接失败: ' + e.message, 'err'); }
    }
    function stopLog() { if (es) { es.close(); es = null; } $('#logDot').classList.remove('on'); }
    function appendLog(line) {
      const body = $('#logBody');
      const nearBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 40;
      const span = document.createElement('div');
      if (line.indexOf('[ERROR]') >= 0) span.className = 'le';
      else if (line.indexOf('[WARNING]') >= 0) span.className = 'lw';
      span.textContent = line;
      body.appendChild(span);
      while (body.childNodes.length > 800) body.removeChild(body.firstChild);
      if (nearBottom) body.scrollTop = body.scrollHeight;
    }
    function clearLog() { $('#logBody').innerHTML = ''; }

    (function init() {
      const sel = $('#fType');
      sel.innerHTML = PLATFORMS.map(p => '<option value="' + p[0] + '">' + p[1] + '</option>').join('');
      sel.addEventListener('change', syncUrlField);
      document.querySelectorAll('.mask').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModal(m.id); }));
      loadList();
      setInterval(loadList, 15000);
    })();
  </script>
</body>

</html>
